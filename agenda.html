<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>วาระสำคัญ | แดชบอร์ดกลไกการดำเนินงานทรัพยากรทางทะเลและชายฝั่ง</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/tailwind-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="bg-ocean-50/40 text-ocean-900 antialiased">
  <div id="site-nav"></div>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
    <header class="fade-in">
      <h1 id="page-title" class="text-2xl sm:text-3xl font-extrabold text-ocean-900 leading-snug"></h1>
      <p id="page-subtitle" class="mt-2 text-sm sm:text-base text-ocean-700/80 max-w-3xl"></p>
    </header>

    <!-- Status summary -->
    <section class="grid grid-cols-1 sm:grid-cols-3 gap-4" id="status-cards"></section>

    <!-- Chart -->
    <section class="bg-white rounded-2xl shadow-card p-5">
      <h2 id="byGroup-title" class="font-bold text-ocean-900 mb-4"></h2>
      <div class="chart-box !h-72 md:!h-80"><canvas id="group-status-chart"></canvas></div>
    </section>

    <!-- Table controls -->
    <section class="bg-white rounded-2xl shadow-card p-5">
      <div class="flex flex-col gap-4">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <h2 id="key-agenda-title" class="font-bold text-ocean-900"></h2>
          <p id="priority-note" class="text-xs text-ocean-700/60"></p>
        </div>

        <div class="flex flex-col sm:flex-row gap-3">
          <div class="relative flex-1">
            <input id="search-input" type="text" placeholder="ค้นหาเรื่อง / กลไก / มติ..."
              class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-ocean-100 focus:border-ocean-400 focus:ring-2 focus:ring-ocean-100 outline-none text-sm" />
            <svg class="w-4 h-4 text-ocean-400 absolute left-3.5 top-1/2 -translate-y-1/2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M17 10a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          </div>
          <select id="status-filter" class="rounded-xl border border-ocean-100 focus:border-ocean-400 focus:ring-2 focus:ring-ocean-100 outline-none text-sm px-3 py-2.5">
            <option value="">ทุกสถานะ</option>
          </select>
          <button id="priority-toggle" class="rounded-xl border border-ocean-100 px-4 py-2.5 text-sm font-semibold text-ocean-700 hover:bg-ocean-50 transition whitespace-nowrap">
            ★ เฉพาะสำคัญเร่งด่วน
          </button>
        </div>

        <div class="flex flex-wrap items-center gap-2 text-xs">
          <span class="text-ocean-700/60">เรียงตาม:</span>
          <button data-sort="id" class="sort-btn px-3 py-1 rounded-full bg-ocean-900 text-white font-semibold">ลำดับ</button>
          <button data-sort="status" class="sort-btn px-3 py-1 rounded-full bg-ocean-50 text-ocean-700 hover:bg-ocean-100 font-semibold">สถานะ</button>
        </div>
      </div>

      <p id="result-count" class="text-xs text-ocean-700/60 mt-4 mb-2"></p>
      <div id="agenda-list" class="space-y-3"></div>
      <p id="empty-state" class="hidden text-center text-sm text-ocean-700/60 py-10">ไม่พบรายการที่ตรงกับเงื่อนไข</p>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/utils.js"></script>
  <script src="assets/js/agenda.js"></script>
</body>
</html>
